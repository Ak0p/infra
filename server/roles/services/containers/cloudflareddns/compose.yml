---
services:
  cloudflare-ddns:
    image: timothyjmiller/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    security_opt:
      - no-new-privileges:true
    network_mode: 'host'
    environment:
      - PUID=1000
      - PGID=1000

# daca nu se schimba fisierul la run inseamna ca nu si-a dat restart container-ul
    volumes:
      - "{{ docker_compose_dir }}/cloudflareddns/config.json:/config.json"
    restart: unless-stopped