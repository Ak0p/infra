networks:
  proxy:
    name: proxy
    external: true

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    volumes:
      - "{{docker_dir}}/vaultwarden/data:/data"
    ports:
      - 8443:80
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.bitwarden-secure.rule=Host(`{{ bitwarden_url }}`)
      - traefik.http.routers.bitwarden-secure.entrypoints=https
      - traefik.http.routers.bitwarden-secure.tls=true
      - traefik.http.routers.bitwarden-secure.service=bitwarden
      - traefik.http.services.bitwarden.loadbalancer.server.port=80
