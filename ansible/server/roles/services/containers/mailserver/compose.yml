services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    # Provide the FQDN of your mail server here (Your DNS MX record should point to this value)
    hostname: mail.akop.ro
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - {{ docker_dir }}/dms/mail-data/:/var/mail/
      - {{ docker_dir }}/dms/mail-state/:/var/mail-state/
      - {{ docker_dir }}/dms/mail-logs/:/var/log/mail/
      - {{ docker_dir }}/dms/config/:/tmp/docker-mailserver/
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ENABLE_RSPAMD=1
      - ENABLE_CLAMAV=1
      - ENABLE_FAIL2BAN=1
      - SSL_TYPE=letsencrypt
      - PERMIT_DOCKER=network
      - ONE_DIR=1
      - ENABLE_FAIL2BAN=1
      - SPOOF_PROTECTION=1
    cap_add:
      - NET_ADMIN # For Fail2Ban to work
      - SYS_PTRACE
    restart: always