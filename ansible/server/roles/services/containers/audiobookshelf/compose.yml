services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    volumes:
      - "{{ library }}/audiobooks:/audiobooks"
      - "{{ library }}/podcasts:/podcasts"
      - "{{ docker_compose_dir }}/audiobookshelf/config:/config"
      - "{{ library }}/absmetadata:/metadata"
    environment:
      - TZ=Europe/Athens
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.audiobookshelf-secure.rule=Host(`{{ audiobookshelf_url }}`)
      - traefik.http.routers.audiobookshelf-secure.entrypoints=https-external
      - traefik.http.routers.audiobookshelf-secure.tls=true
      - traefik.http.routers.audiobookshelf.service=audiobookshelf
      - traefik.http.services.audiobookshelf.loadbalancer.server.port=80
    networks:
      proxy:

networks:
  proxy:
    name: proxy
    external: true