networks:
  maclandefault:
    external:
      true

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    # ports:
      # <Host Port>:<Container Port>
      # - 3001:3001
    restart: unless-stopped
    networks:
      maclandefault:
        ipv4_address: 192.168.1.3

