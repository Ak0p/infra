services:
  wireguard:
      image: linuxserver/wireguard
      container_name: wireguard
      cap_add:
        - NET_ADMIN
        - SYS_MODULE
      environment:
        - PUID=1000
        - PGID=1000
        - TZ=Europe/Athens
        - SERVERURL={{ vpn_url }} #optional
        - SERVERPORT=51820 #optional
        - PEERS=5 #optional
        - PEERDNS=auto #optional
        - INTERNAL_SUBNET=10.11.12.0 #optional
      volumes:
        - "{{ docker_dir }}/wireguard/config:/config"
        - /lib/modules:/lib/modules
      sysctls:
        - net.ipv4.conf.all.src_valid_mark=1
      restart: unless-stopped
      ports:
        - 51820:51820/udp
      # networks:
      #   - maclandefault




